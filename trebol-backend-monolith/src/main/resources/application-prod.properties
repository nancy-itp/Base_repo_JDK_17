############################################################
#
# PRODUCTION PROFILE (MariaDB / Amazon RDS)
# Enable with SPRING_PROFILES_ACTIVE=prod. Loaded on top of application.properties.
# Every environment-specific or secret value comes from an environment variable.
# Values without a default (DB_HOST, DB_USERNAME, DB_PASSWORD, JWT_SECRET_KEY) are required:
# the app refuses to start if they are missing, rather than running with a placeholder.
#
##############################
# DATABASE (on AWS, DB_HOST is the RDS Proxy endpoint)
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:trebol}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
## Recycle connections before RDS Proxy's idle timeout closes them
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}
## Flyway owns the schema; Hibernate must not change it and data.sql must not run
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
##############################
# SECURITY
trebol.security.jwt-secret-key=${JWT_SECRET_KEY}
trebol.security.bcrypt-encoder-strength=${BCRYPT_STRENGTH:10}
trebol.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
##############################
# API DOCS (off in production unless explicitly enabled)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
##############################
# PAYMENTS (Webpay is disabled for the POC; URLs kept configurable)
trebol.payment.webpayplus.production=false
trebol.payment.webpayplus.callback-url=${WEBPAY_CALLBACK_URL:http://localhost:8080/public/checkout/validate}
trebol.payment.webpayplus.browser-redirection-url=${WEBPAY_REDIRECT_URL:http://localhost:4200/store/receipt}
##############################
# LOGGING
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=WARN
